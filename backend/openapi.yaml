openapi: 3.0.3
info:
  title: PharmaOS Cloud API
  version: 0.1.0
  description: |
    Contract shared by desktop, mobile and admin tools. `tenantId` is never sent by clients;
    it comes from the access token.
servers:
  - url: https://api.example.in
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness check
      responses: { '200': { description: OK } }

  /v1/auth/otp/request:
    post:
      security: []
      summary: Request login OTP (rate limited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string, example: "+919876543210" } } }
      responses: { '202': { description: Accepted }, '429': { description: Too many requests } }

  /v1/auth/otp/verify:
    post:
      security: []
      summary: Verify OTP and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone, otp, deviceId], properties: { phone: {type: string}, otp: {type: string}, deviceId: {type: string, format: uuid} } }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }

  /v1/auth/refresh:
    post:
      security: []
      summary: Rotate refresh token
      responses: { '200': { description: New tokens } }

  /v1/devices:
    post:
      summary: Register a device (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [storeId, label, publicKey], properties: { storeId: {type: string, format: uuid}, label: {type: string}, publicKey: {type: string} } }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { deviceId: {type: string}, code: {type: string} } } } } } }

  /v1/devices/{id}/revoke:
    post:
      summary: Revoke a device (owner only)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '204': { description: Revoked } }

  /v1/sync/push:
    post:
      summary: Push local events (idempotent by eventId)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequest' }
      responses:
        '200':
          description: Per-event result
          content: { application/json: { schema: { $ref: '#/components/schemas/PushResult' } } }
        '401': { description: Unauthorized }
        '403': { description: device_revoked }
        '429': { description: Slow down }

  /v1/sync/pull:
    get:
      summary: Pull events from other devices
      parameters:
        - { name: cursor, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 500 } }
      responses:
        '200':
          description: Events page
          content: { application/json: { schema: { $ref: '#/components/schemas/PullResponse' } } }

  /v1/backups/snapshots:
    post:
      summary: Create upload URL for encrypted snapshot
      responses: { '201': { description: Pre-signed URL } }
    get:
      summary: List snapshots
      responses: { '200': { description: OK } }

  /v1/messages/bill:
    post:
      summary: Queue bill delivery (blocked unless consent exists)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [salesInvoiceId, channel], properties: { salesInvoiceId: {type: string, format: uuid}, channel: {type: string, enum: [whatsapp, sms]} } }
      responses: { '202': { description: Queued }, '409': { description: No valid consent } }

  /v1/gst/returns/{type}/{period}:
    get:
      summary: Get prepared GST return data (GSTR1 or GSTR3B)
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [GSTR1, GSTR3B] } }
        - { name: period, in: path, required: true, schema: { type: string, pattern: '^\d{6}$' } }
      responses: { '200': { description: OK } }
    post:
      summary: Submit via GSP (after CA sign-off)
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { name: period, in: path, required: true, schema: { type: string } }
      responses: { '202': { description: Accepted } }

  /v1/ai/purchase-ocr:
    post:
      summary: Upload invoice image for OCR draft
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses: { '202': { description: Job created } }

  /v1/privacy/requests:
    post:
      summary: Record a data-principal request (access, correction, erasure)
      responses: { '201': { description: Created } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    TokenPair:
      type: object
      properties: { accessToken: {type: string}, refreshToken: {type: string}, expiresIn: {type: integer} }
    SyncEvent:
      type: object
      required: [eventId, entity, op, payload, hlc]
      properties:
        eventId: { type: string, format: uuid }
        entity: { type: string, enum: [product, supplier, customer, batch, stock_movement, purchase_invoice, sales_invoice, prescription] }
        op: { type: string, enum: [upsert, void] }
        payload: { type: object }
        hlc: { type: string, example: "1761038400000-0003-A1" }
    PushRequest:
      type: object
      required: [events]
      properties: { events: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/SyncEvent' } } }
    PushResult:
      type: object
      properties:
        accepted: { type: array, items: { type: string } }
        duplicates: { type: array, items: { type: string } }
        rejected:
          type: array
          items: { type: object, properties: { eventId: {type: string}, reason: {type: string} } }
    PullResponse:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              eventId: { type: string }
              entity: { type: string }
              op: { type: string }
              payload: { type: object }
              hlc: { type: string }
        nextCursor: { type: integer }
        hasMore: { type: boolean }
