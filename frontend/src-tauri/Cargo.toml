[package]
name = "pharmaos-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher bundled; vendored OpenSSL avoids a system OpenSSL dependency on Windows
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
panic = "abort"
